<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebTransport echo test fixture</title>
</head>
<body>
<h1>WebTransport echo test fixture</h1>
<p>This page is loaded by Playwright; it exposes <code>window.*</code> entry points the JUnit
tests call via <code>page.evaluate(...)</code>.</p>
<pre id="log"></pre>
<script>
"use strict";

let wt = null;

function log(msg) {
    const el = document.getElementById("log");
    el.textContent += msg + "\n";
}

async function readAllText(reader) {
    const chunks = [];
    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        chunks.push(value);
    }
    let total = 0;
    for (const c of chunks) total += c.length;
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return new TextDecoder().decode(out);
}

window.connect = async ({ url, certHash }) => {
    // certHash is an array of byte values (each 0-255) — the SHA-256 of the DER-encoded
    // server certificate. Used with WebTransport's serverCertificateHashes option to trust
    // the self-signed test cert without a CA chain.
    const bytes = new Uint8Array(certHash);
    let phase = "construct";
    try {
        wt = new WebTransport(url, {
            serverCertificateHashes: [{
                algorithm: "sha-256",
                value: bytes.buffer
            }]
        });
        phase = "ready";
        // Race wt.ready against an explicit deadline so the test fails fast with a clear
        // error instead of hanging on a Playwright default timeout when something is wrong
        // server-side.
        await Promise.race([
            wt.ready,
            new Promise((_, rej) => setTimeout(() => rej(new Error("wt.ready 8s timeout")), 8000))
        ]);
        log("connected: " + url);
        return { ok: true };
    } catch (e) {
        let closedInfo = null;
        if (wt) {
            try {
                // wt.closed sometimes never settles on broken handshakes — bound it.
                closedInfo = await Promise.race([
                    wt.closed.then(
                        v => ({ closeCode: v && v.closeCode, reason: v && v.reason }),
                        c => ({ closeCode: c && c.closeCode, reason: c && c.reason, message: String(c) })),
                    new Promise(resolve => setTimeout(() => resolve({ message: "wt.closed 2s timeout" }), 2000))
                ]);
            } catch (_) {}
        }
        return {
            ok: false,
            phase: phase,
            error: String(e),
            name: e && e.name,
            message: e && e.message,
            closed: closedInfo
        };
    }
};

// Wrap any test promise with a deadline so a server-side regression doesn't hang the test
// runner indefinitely. Default 8s — enough for a real round-trip on loopback, fast enough
// to fail the test cleanly when something is wrong.
function withDeadline(promise, label, ms = 8000) {
    return Promise.race([
        promise,
        new Promise((_, rej) => setTimeout(() => rej(new Error(label + " " + ms + "ms timeout")), ms))
    ]);
}

window.echoBidi = (text) => withDeadline((async () => {
    const stream = await wt.createBidirectionalStream();
    const writer = stream.writable.getWriter();
    await writer.write(new TextEncoder().encode(text));
    await writer.close();
    return await readAllText(stream.readable.getReader());
})(), "echoBidi");

window.echoUni = (text) => withDeadline((async () => {
    const writable = await wt.createUnidirectionalStream();
    const writer = writable.getWriter();
    await writer.write(new TextEncoder().encode(text));
    await writer.close();
    const reader = wt.incomingUnidirectionalStreams.getReader();
    const { value: replyStream } = await reader.read();
    reader.releaseLock();
    return await readAllText(replyStream.getReader());
})(), "echoUni");

window.echoDatagram = (text) => withDeadline((async () => {
    const writer = wt.datagrams.writable.getWriter();
    await writer.write(new TextEncoder().encode(text));
    writer.releaseLock();
    const reader = wt.datagrams.readable.getReader();
    const { value } = await reader.read();
    reader.releaseLock();
    return new TextDecoder().decode(value);
})(), "echoDatagram");

window.observeIncomingBidi = async () => {
    const reader = wt.incomingBidirectionalStreams.getReader();
    const { value: stream } = await reader.read();
    reader.releaseLock();
    return await readAllText(stream.readable.getReader());
};

window.gracefulClose = async (code, reason) => {
    wt.close({ closeCode: code, reason: reason });
    try {
        const info = await wt.closed;
        return { ok: true, closeCode: info.closeCode, reason: info.reason };
    } catch (e) {
        return { ok: false, error: String(e) };
    }
};

window.observeDraining = async () => {
    await wt.draining;
    return true;
};
</script>
</body>
</html>
